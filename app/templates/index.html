<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INVENThair</title>
<link rel="icon" href="/static/icone.svg" type="image/svg+xml">
<style>
/* Page provisoire de l'étape 1 : l'interface complète arrive à l'étape 7. */
:root { --prune: #430D2B; --mauve: #79365C; --soleil: #F6BE28; --rose-pale: #FCD4E6; --encre: #270317; --fond: #FFF0F6; --blanc: #FFFFFF; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
  background-color: var(--fond); background-image: radial-gradient(var(--rose-pale) 1.6px, transparent 1.8px); background-size: 16px 16px;
  font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; color: var(--encre); text-align: center; }
.logo { font-family: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif; font-weight: 900; font-size: 64px; line-height: 1;
  color: var(--blanc); -webkit-text-stroke: 3px var(--prune); text-shadow: 6px 6px 0 var(--prune); }
.logo span { color: var(--soleil); }
p { font-weight: 800; font-size: 18px; color: var(--mauve); }
a { color: var(--mauve); font-weight: 900; }
</style>
</head>
<body>
<main>
  <div class="logo">INVENT<span>hair</span></div>
  <p>L'appli est bien lancée. Les écrans arrivent bientôt !</p>
  <p><a href="/docs">Voir la documentation de l'API</a></p>
</main>
</body>
</html>
