<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ titre }} · INVENThair</title>
<link rel="icon" href="/static/icone.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/nunito-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/lilita-one-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css?v={{ version }}">
</head>
<body>
<a class="sr" href="#contenu">Aller au contenu</a>
<div class="wrap">
{% block entete %}
<header class="entete">
  <a class="logo" href="/" aria-label="INVENThair, retour à l'accueil">INVENT<span>hair</span></a>
  {% include "_nav.html" %}
</header>
{% endblock %}
<main id="contenu" class="contenu">
{% block contenu %}{% endblock %}
</main>
</div>
<div id="annonces" class="annonces" aria-live="polite"></div>
{% block fenetres %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
